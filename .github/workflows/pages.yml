# LEGACY/RETIRED: old Murdilimax deployment kept for reference only.
# Current live site is built and deployed from virus53111/dogizen main.
# Automatic schedule and push triggers removed after repeated failures.
name: Legacy MURDILIMAX deployment (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the single source of truth
        uses: actions/checkout@v4
        with:
          repository: virus53111/dogizen
          ref: main
          persist-credentials: false
      - name: Verify cinema and domain before publishing
        shell: bash
        run: |
          test -s index.html
          test "$(tr -d '\r\n' < CNAME)" = "murdilimax.com"
          grep -q 'твоя вселенная кино' index.html
          git rev-parse HEAD
          sha256sum index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
