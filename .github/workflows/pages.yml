name: Refresh offers and publish
on:
  push:
    branches: [main]
    paths-ignore: ['auto-offers.json', 'source-status.json']
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collectors
        run: python3 -m unittest discover -s tests -v
      - name: Refresh public sources
        run: python3 refresh.py
      - name: Persist source history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto-offers.json source-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update offers and source status [skip ci]'
            git push
          fi
      - name: Build site
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source failures
        run: |
          python3 - <<'PY'
          import json,os
          data=json.load(open('source-status.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Source refresh\n')
            for name,s in data['sources'].items():
              f.write(f"- {name}: {s['state']}; {s['count']} entries; last success {s.get('last_success')}\n")
          PY
