name: Deploy MURDILIMAX
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Scan new SS.com construction listings
        run: node scripts/scan-ss.mjs
      - name: Scan public tasks and helpers across Latvia
        run: node scripts/scan-public-opportunities.mjs
      - name: Generate Google pages for cities and categories
        run: node scripts/generate-radar-pages.mjs
       - name: Generate social preview pages for public tasks
        run: node scripts/generate-task-pages.mjs
      - name: Notify IndexNow search engines
        run: node scripts/submit-indexnow.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Save monitor state
        run: |
          git config user.name "murdilimax-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add public/ss-leads.json .monitor/ss-state.json public/external-leads.json .monitor/external-state.json
          git diff --cached --quiet || git commit -m "Update SS.com monitor state [skip ci]"
          git push
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs._page_url }}
