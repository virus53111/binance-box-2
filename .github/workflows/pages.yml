# Publish the cinema playback update; canonical source remains dogizen/main.
name: Deploy MURDILIMAX from dogizen
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the single source of truth
        uses: actions/checkout@v4
        with:
          repository: virus53111/dogizen
          ref: main
          persist-credentials: false
      - name: Verify cinema and domain before publishing
        shell: bash
        run: |
          test -s index.html
          test "$(tr -d '\r\n' < CNAME)" = "murdilimax.com"
          grep -q 'твоя вселенная кино' index.html
          git rev-parse HEAD
          sha256sum index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
