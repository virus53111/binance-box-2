<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#01040a" />
  <meta name="description" content="Live Earth — claim a permanent place on Earth from TikTok LIVE gifts." />
  <title>Live Earth</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040a;font-family:Inter,system-ui,sans-serif;color:#eaf8ff}body{position:relative}.shell{position:fixed;inset:0;background:radial-gradient(circle at 50% 44%,#0a2638 0,#020912 45%,#01040a 76%)}.loader{position:absolute;inset:0;display:grid;place-items:center;z-index:1;transition:opacity .45s ease}.loader-card{text-align:center}.earth{width:68px;height:68px;margin:0 auto 18px;border:1px solid rgba(100,220,255,.42);border-radius:50%;box-shadow:0 0 40px rgba(66,202,255,.18),inset -12px -8px 24px rgba(0,0,0,.65);background:radial-gradient(circle at 34% 28%,#2c7794 0,#0d4564 27%,#08283c 56%,#03101c 100%);animation:spin 3s linear infinite}.loader b{display:block;font-size:14px;letter-spacing:.2em}.loader small{display:block;margin-top:7px;color:#66869b;font-size:10px;letter-spacing:.08em}@keyframes spin{to{transform:rotate(360deg)}}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#01040a;z-index:2}.fallback{position:fixed;right:12px;bottom:12px;z-index:3;opacity:0;pointer-events:none;transition:opacity .4s}.fallback.show{opacity:1;pointer-events:auto}.fallback a{display:inline-flex;padding:8px 11px;border-radius:999px;text-decoration:none;color:#9ee8ff;background:rgba(2,11,20,.82);border:1px solid rgba(100,220,255,.2);font-size:10px;backdrop-filter:blur(10px)}
  </style>
</head>
<body>
  <div class="shell">
    <div id="loader" class="loader"><div class="loader-card"><div class="earth"></div><b>LIVE EARTH</b><small>LOADING THE WORLD</small></div></div>
    <iframe id="liveEarth" title="Live Earth" allow="autoplay; fullscreen; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="fallback" class="fallback"><a id="directLink" href="#" target="_blank" rel="noreferrer">Open Live Earth directly</a></div>
  </div>
  <script>
    (function(){
      var base='https://live-earth-ssnx8x.v2.appdeploy.ai/';
      var query=window.location.search||'';
      var hash=window.location.hash||'';
      var url=base+query+hash;
      var frame=document.getElementById('liveEarth');
      var loader=document.getElementById('loader');
      var fallback=document.getElementById('fallback');
      var direct=document.getElementById('directLink');
      direct.href=url;
      frame.src=url;
      frame.addEventListener('load',function(){loader.style.opacity='0';setTimeout(function(){loader.style.display='none'},500)});
      setTimeout(function(){fallback.classList.add('show')},4500);
    })();
  </script>
</body>
</html>
