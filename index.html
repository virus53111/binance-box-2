  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#01040a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf8ff}html{overflow:hidden}body{position:relative;min-width:320px;overflow:hidden}.shell{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 44%,#0a2638 0,#020912 45%,#01040a 76%)}.seo-copy{position:absolute;inset:0;z-index:0;display:grid;place-items:center;padding:28px;text-align:center}.seo-copy>div{max-width:760px}.seo-copy h1{font-size:clamp(30px,6vw,66px);margin:0 0 14px}.seo-copy p{margin:0;color:#8fa9bc;line-height:1.6}.loader{position:absolute;inset:0;display:grid;place-items:center;z-index:1;transition:opacity .45s ease}.loader-card{text-align:center}.earth{width:68px;height:68px;margin:0 auto 18px;border:1px solid rgba(100,220,255,.42);border-radius:50%;box-shadow:0 0 40px rgba(66,202,255,.18),inset -12px -8px 24px rgba(0,0,0,.65);background:radial-gradient(circle at 34% 28%,#2c7794 0,#0d4564 27%,#08283c 56%,#03101c 100%);animation:spin 3s linear infinite}.loader b{display:block;font-size:14px;letter-spacing:.2em}.loader small{display:block;margin-top:7px;color:#66869b;font-size:10px;letter-spacing:.08em}@keyframes spin{to{transform:rotate(360deg)}}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#01040a;z-index:2}.fallback{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:3;opacity:0;pointer-events:none;transition:opacity .4s}.fallback.show{opacity:1;pointer-events:auto}.fallback a{display:inline-flex;padding:7px 10px;border-radius:999px;text-decoration:none;color:#9ee8ff;background:rgba(2,11,20,.9);border:1px solid rgba(100,220,255,.2);font-size:9px;backdrop-filter:blur(10px)}noscript{position:fixed;inset:auto 16px 16px;z-index:4;padding:12px;border-radius:12px;background:#061522;color:#bfeeff}@media(max-width:760px){.fallback a{font-size:8px;padding:6px 8px}.seo-copy{padding:18px}.seo-copy h1{font-size:34px}}
  </style>

<body>
  <div class="shell">
    <main class="seo-copy">
      <div>
        <h1>Live Earth — TikTok LIVE Interactive World</h1>
        <p>Choose a city, send a TikTok LIVE gift and watch the 3D Earth fly to your place. Your marker stays saved and future gifts upgrade the same location.</p>
      </div>
    </main>
    <div id="loader" class="loader"><div class="loader-card"><div class="earth"></div><b>LIVE EARTH</b><small>LOADING THE WORLD</small></div></div>
    <iframe id="liveEarth" title="Live Earth interactive 3D world" allow="autoplay; fullscreen; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="fallback" class="fallback"><a id="directLink" href="#" target="_blank" rel="noreferrer">Open directly</a></div>
  </div>
  <noscript>Live Earth needs JavaScript to run the interactive globe.</noscript>
  <script>
    (function(){
      var base='https://live-earth-ssnx8x.v2.appdeploy.ai/';
      var query=window.location.search||'';
      var hash=window.location.hash||'';
      var url=base+query+hash;
      var frame=document.getElementById('liveEarth');
      var loader=document.getElementById('loader');
      var fallback=document.getElementById('fallback');
      var direct=document.getElementById('directLink');
      var loaded=false;
      direct.href=url;
      frame.src=url;
      var fallbackTimer=setTimeout(function(){if(!loaded)fallback.classList.add('show')},7000);
      frame.addEventListener('load',function(){
        loaded=true;
        clearTimeout(fallbackTimer);
        fallback.classList.remove('show');
        loader.style.opacity='0';
        setTimeout(function(){loader.style.display='none'},500);
      });
    })();
  </script>
</body>
</html>
