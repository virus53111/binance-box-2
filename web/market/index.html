<!doctype html>
<html lang="ru">

    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020304;color:#f7f9fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.075);background:rgba(2,4,6,.96);position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.09em}.mark{width:38px;height:38px;border:1px solid rgba(67,221,255,.35);border-radius:50%;position:relative}.mark:before,.mark:after{content:"";position:absolute;border:1px solid rgba(67,221,255,.28);border-radius:50%;inset:6px}.mark:after{inset:13px;background:#55e9b1;box-shadow:0 0 15px rgba(85,233,177,.65);border:0}.live{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid rgba(85,233,177,.22);border-radius:999px;color:#67efb7;font-size:10px;font-weight:900;letter-spacing:.12em}.live i{width:6px;height:6px;border-radius:50%;background:#67efb7}.top button{border:1px solid rgba(255,255,255,.09);background:#080b0f;color:#b7c1cc;border-radius:12px;padding:10px 12px;font-weight:800}.shell,#app{min-height:calc(100dvh - 70px)}.boot{height:calc(100dvh - 70px);display:grid;place-items:center;color:#64717d;font-size:12px;letter-spacing:.08em}.spin{width:22px;height:22px;border:2px solid #15222b;border-top-color:#62e6ff;border-radius:50%;animation:s .7s linear infinite;margin:0 auto 10px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:620px){.top{height:65px;padding:0 10px}.brand{font-size:16px}.mark{width:35px;height:35px}.shell,#app{min-height:calc(100dvh - 65px)}}
  </style>
